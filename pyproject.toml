[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholar-mcp"
version = "0.1.0"
description = "MCP server that gives LLM agents grounded access to arXiv and Semantic Scholar: paper search, citation graphs, BibTeX, and related-work prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
scholar-mcp = "scholar_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "I001"]
